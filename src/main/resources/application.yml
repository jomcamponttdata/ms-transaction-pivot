spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${TRANSACTION_MONGODB_URI:mongodb://localhost:27017/movement_db}
  mongodb:
    representation:
      uuid: standard
server:
  port: ${TRANSACTION_SERVICE_PORT:8084}
logging:
  level:
    com.pivot.banking.transaction: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
